<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure Share (Yopass-совместимый)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/openpgp/4.10.9/openpgp.min.js"></script>
<style>
  :root{color-scheme: light dark;}
  body{font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width:640px; margin:40px auto; padding:0 16px; line-height:1.5;}
  textarea{width:100%; min-height:140px; box-sizing:border-box; padding:10px; font-family:monospace; font-size:14px;}
  select, button, input[type=checkbox]{font-size:15px;}
  button{padding:10px 18px; border:0; border-radius:6px; background:#2563eb; color:#fff; cursor:pointer; margin-top:10px;}
  button:disabled{opacity:.5; cursor:default;}
  .row{margin:10px 0; display:flex; align-items:center; gap:8px;}
  .box{border:1px solid #ccc; border-radius:8px; padding:16px; margin-top:16px; word-break:break-all;}
  .link{font-family:monospace; background:#f3f4f6; padding:8px; border-radius:6px; display:block; margin:8px 0;}
  .warn{color:#b45309;}
  .err{color:#b91c1c;}
  a{color:#2563eb;}
</style>
</head>
<body>

<h2>🔒 Secure Share</h2>

<div id="createView">
  <p>Текст шифруется в вашем браузере. На сервер уходит только зашифрованный блок, ключ остаётся в адресной строке (после <code>#</code>) и никогда не передаётся на сервер.</p>
  <textarea id="secretText" placeholder="Введите секрет..."></textarea>
  <div class="row">
    <label>Срок хранения:
      <select id="expiration">
        <option value="3600">1 час</option>
        <option value="86400" selected>1 день</option>
        <option value="604800">1 неделя</option>
      </select>
    </label>
  </div>
  <div class="row">
    <label><input type="checkbox" id="oneTime" checked> Одноразовая ссылка (удалить после первого просмотра)</label>
  </div>
  <button id="encryptBtn">Зашифровать и получить ссылку</button>
  <div id="createResult"></div>
</div>

<div id="viewView" style="display:none">
  <div id="viewResult">Расшифровка...</div>
</div>

<script>
const API = "https://api.yopass.se"; // публичный бэкенд Yopass

function randomKey() {
  const bytes = new Uint8Array(32);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("");
}

async function encryptMessage(text, key) {
  const { data } = await openpgp.encrypt({
    message: openpgp.message.fromText(text),
    passwords: [key],
    armor: true
  });
  return data;
}

async function decryptMessage(armored, key) {
  const message = await openpgp.message.readArmored(armored);
  const { data } = await openpgp.decrypt({ message, passwords: [key] });
  return data;
}

// ---------- Создание секрета ----------
document.getElementById("encryptBtn").addEventListener("click", async () => {
  const text = document.getElementById("secretText").value.trim();
  const resultEl = document.getElementById("createResult");
  if (!text) { resultEl.innerHTML = '<p class="err">Введите текст секрета.</p>'; return; }

  const btn = document.getElementById("encryptBtn");
  btn.disabled = true;
  btn.textContent = "Шифрование...";

  try {
    const key = randomKey();
    const armored = await encryptMessage(text, key);
    const expiration = parseInt(document.getElementById("expiration").value, 10);
    const oneTime = document.getElementById("oneTime").checked;

    const res = await fetch(`${API}/secret`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: armored, expiration, one_time: oneTime })
    });
    if (!res.ok) throw new Error("Сервер вернул ошибку " + res.status);
    const json = await res.json();
    const uuid = json.message;

    const shareUrl = `${location.origin}${location.pathname}#/s/${uuid}/${key}`;
    resultEl.innerHTML = `
      <div class="box">
        <p>Ссылка готова:</p>
        <code class="link" id="shareLink">${shareUrl}</code>
        <button id="copyBtn">Скопировать</button>
        <p class="warn">${oneTime ? "Ссылка одноразовая — она исчезнет сразу после первого открытия." : "Ссылка многоразовая, действует до истечения срока."}</p>
      </div>`;
    document.getElementById("copyBtn").addEventListener("click", () => {
      navigator.clipboard.writeText(shareUrl);
    });
  } catch (e) {
    resultEl.innerHTML = `<p class="err">Ошибка: ${e.message}</p>`;
  } finally {
    btn.disabled = false;
    btn.textContent = "Зашифровать и получить ссылку";
  }
});

// ---------- Просмотр секрета ----------
async function renderViewer() {
  // формат хэша: #/s/<uuid>/<key>
  const parts = location.hash.replace(/^#\/?/, "").split("/");
  if (parts[0] !== "s" || !parts[1] || !parts[2]) return;

  document.getElementById("createView").style.display = "none";
  const viewView = document.getElementById("viewView");
  viewView.style.display = "block";
  const [, uuid, key] = parts;
  const resultEl = document.getElementById("viewResult");

  try {
    const res = await fetch(`${API}/secret/${uuid}`);
    if (res.status === 404) {
      resultEl.innerHTML = '<p class="err">Секрет не найден: срок истёк или он уже был просмотрен ранее.</p>';
      return;
    }
    if (!res.ok) throw new Error("Сервер вернул ошибку " + res.status);
    const json = await res.json();
    const plaintext = await decryptMessage(json.message, key);

    resultEl.innerHTML = `
      <div class="box">
        <p>Расшифрованный секрет:</p>
        <textarea readonly style="min-height:140px">${plaintext.replace(/</g,"&lt;")}</textarea>
        <button id="copySecret">Скопировать</button>
        ${json.one_time ? '<p class="warn">Это была одноразовая ссылка — она уже удалена с сервера.</p>' : ""}
      </div>`;
    document.getElementById("copySecret").addEventListener("click", () => {
      navigator.clipboard.writeText(plaintext);
    });
  } catch (e) {
    resultEl.innerHTML = `<p class="err">Не удалось расшифровать: неверный ключ или повреждённые данные (${e.message}).</p>`;
  }
}

window.addEventListener("hashchange", () => location.reload());
if (location.hash) renderViewer();
</script>
</body>
</html>
